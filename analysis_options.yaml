# Static analysis configuration. Run with `flutter analyze`.
#
# Starts from the recommended Flutter lint set and adds a few stricter rules
# (audit F, low: this file was the untouched template). Suppress a rule for one
# line with `// ignore: name_of_lint` or a file with `// ignore_for_file: ...`.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # BuildContext across an await gap must be mounted-guarded.
    use_build_context_synchronously: true
    # Every Future is awaited or explicitly unawaited().
    unawaited_futures: true
    # Pairs with `dart format`; keeps diffs small.
    require_trailing_commas: true
    prefer_final_locals: true
    directives_ordering: true

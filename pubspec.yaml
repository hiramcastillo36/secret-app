name: racha
description: "Racha — la app de citas y racha semanal para parejas."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Map (OpenStreetMap tiles, no Google Maps SDK)
  flutter_map: ^7.0.2
  flutter_map_cache: ^2.1.0
  dio_cache_interceptor: ^4.0.7
  latlong2: ^0.9.1

  # Opening the OSM copyright page from the map attribution (ODbL requirement)
  url_launcher: ^6.3.0

  # i18n formatting
  intl: ^0.20.2
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
